version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: nmon-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nmon_secret_2024}
      MONGO_INITDB_DATABASE: nmon
    volumes:
      - mongodb_data:/data/db
      - ./server/scripts/init-mongo.js:/docker-entrypoint-initdb.js
    networks:
      - nmon-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nmon-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-nmon_secret_2024}@mongodb:27017/nmon?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Telegram Bot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Email SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-nmon@alerts.com}
    volumes:
      - server_logs:/app/logs
    networks:
      - nmon-network
    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend Dashboard (Nginx-based)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nmon-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - nmon-network
    depends_on:
      - server

volumes:
  mongodb_data:
    driver: local
  server_logs:
    driver: local

networks:
  nmon-network:
    driver: bridge
